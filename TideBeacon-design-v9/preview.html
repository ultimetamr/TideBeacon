<title>TideBeacon · Web Design Validation · r3</title>
<style>
:root{--night:#06111f;--deep:#0b2033;--glass:rgba(16,35,51,.88);--line:#456377;--text:#f1f5f6;--muted:#a9bcc6;--aqua:#74d8d1;--warm:#f4c88b;--danger:#ff9b91;--ok:#9be3bb;--r:24px;--gap:16px;font-family:Inter,"Noto Sans SC",system-ui,sans-serif;color:var(--text);background:var(--night)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 10%,#173f58 0,#071522 45%,#030912 100%);overflow:hidden}button,select{font:inherit;color:inherit}button{min-height:44px;border:1px solid var(--line);border-radius:14px;background:#142b3c;padding:9px 14px;cursor:pointer}button:hover,button:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}button.primary{background:#1f625f;border-color:var(--aqua)}button.warn{border-color:var(--danger)}button[disabled]{opacity:.45;cursor:not-allowed}.scope{position:fixed;z-index:100;left:12px;top:10px;padding:6px 10px;border:1px dashed var(--line);border-radius:9px;background:#081622;color:var(--muted);font-size:12px}.app{height:100vh;display:grid;grid-template-columns:1fr 370px}.product{position:relative;overflow:hidden;isolation:isolate}.audit{overflow:auto;background:#07121deF;border-left:1px solid var(--line);padding:16px 14px 40px}.audit h1{font-size:17px;margin:36px 0 6px}.audit h2{font-size:14px;color:var(--aqua);margin:18px 0 7px}.audit p,.audit label,.audit output{font-size:12px;line-height:1.5;color:var(--muted)}.audit-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.audit select{width:100%;background:#102536;border:1px solid var(--line);border-radius:10px;padding:8px}.audit button{font-size:12px;min-height:36px;padding:7px}.pillrow{display:flex;flex-wrap:wrap;gap:6px}.pillrow button{padding:5px 8px}.statusbox{margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:#0b1d2b;word-break:break-word}.world{position:absolute;inset:0;background:linear-gradient(#0b2a41 0 58%,#0c354a 58% 68%,#0a2438 68%)}.world.scene-cloud{background:linear-gradient(#25445a 0 48%,#91aab5 48% 62%,#172e42 62%)}.world.scene-dune{background:linear-gradient(#112b43 0 60%,#80694a 60% 70%,#3c2d25 70%)}.stars{position:absolute;inset:0;background-image:radial-gradient(circle,#d9f7ff 0 1px,transparent 1.5px);background-size:67px 61px;opacity:0}.stars.accent{animation:stars 1.3s ease-out}.sea{position:absolute;left:0;right:0;bottom:0;height:36%;background:repeating-linear-gradient(173deg,rgba(116,216,209,.12) 0 2px,transparent 2px 34px)}.product-surface{position:absolute;inset:0;display:grid;place-items:center;padding:64px 48px 44px}.beacon-guide{text-align:center;display:grid;justify-items:center;gap:18px;z-index:2}.lighthouse{width:90px;height:210px;clip-path:polygon(35% 0,65% 0,80% 100%,20% 100%);background:linear-gradient(90deg,#899ca5,#edf2ec 45%,#81929a);box-shadow:0 20px 40px #02070b;position:relative}.lighthouse::before{content:"";position:absolute;top:0;left:18%;right:18%;height:18px;background:#f7d4a2}.lighthouse[role=button]{cursor:pointer}.halo{width:220px;height:220px;border:3px solid rgba(244,200,139,.75);border-radius:50%;position:absolute;top:calc(50% - 174px);box-shadow:0 0 45px rgba(244,200,139,.42),inset 0 0 42px rgba(116,216,209,.12);transform:scale(var(--halo-scale,1));transition:transform .24s linear,opacity .24s}.instruction{font-size:20px;line-height:1.55;max-width:520px}.phase{font-size:28px}.countdown{font-size:40px;font-variant-numeric:tabular-nums}.panel{position:relative;z-index:5;width:min(92%,1072px);background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:32px;padding:24px;box-shadow:0 26px 70px #02070b99}.setup{width:min(94%,1216px);display:grid;gap:18px}.choice{display:grid;grid-template-columns:120px repeat(3,1fr);align-items:center;gap:9px}.choice>strong{color:var(--muted)}.choice button[aria-pressed=true]{border-color:var(--aqua);background:#174c4d}.pattern-detail{text-align:center;color:var(--muted)}.controls{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);display:grid;grid-template-columns:1.2fr repeat(4,1fr);gap:10px}.completion{text-align:center}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.notice{display:flex;align-items:center;gap:12px;border:2px solid var(--warm);border-radius:12px;padding:14px;background:#101b28}.shape{width:22px;height:22px;border:3px solid currentColor;transform:rotate(45deg);flex:none}.notice.error{border-color:var(--danger);color:var(--danger)}.notice.fallback{border-style:dashed}.dialog-backdrop{position:absolute;inset:0;z-index:30;background:#02070bcc;display:grid;place-items:center}.dialog{z-index:40;width:min(90%,640px);background:#101b28;border:2px solid var(--aqua);border-radius:32px;padding:32px}.dialog h2{font-size:28px}.dialog .actions{margin-top:24px}.demo-layer{position:absolute;right:18px;top:18px;z-index:20;width:min(480px,60%);background:#0a1b29ef;border:1px solid var(--aqua);border-radius:18px;padding:14px;display:none}.demo-layer.show{display:block}.demo-layer code{color:var(--warm);word-break:break-all}.semantic-error{color:var(--danger)}.semantic-ok{color:var(--ok)}[data-component-state=focused],[data-variant=controllerFocus]{outline:3px solid var(--aqua)}[data-component-state=disabled]{opacity:.45}[data-component-state=error],[data-variant*=Error],[data-variant=saveFailed]{border-color:var(--danger)!important}[data-component-state=hold]{border-style:dashed}[data-component-state=paused],[data-variant=paused]{filter:saturate(.4)}[data-stack]{box-shadow:0 0 0 3px var(--warm)}
.product[data-responsive=Compact] .setup{width:min(94%,896px)}.product[data-responsive=Compact] .choice{grid-template-columns:100px repeat(3,1fr)}.product[data-responsive=Compact] .preview-swatch{display:none}.product[data-responsive=Constrained] .setup{width:min(94%,896px)}.product[data-responsive=Constrained] .choice{grid-template-columns:1fr}.product[data-responsive=Constrained] .choice:not(.active-group){display:none}.product[data-responsive=Constrained] .controls{width:min(94%,672px);grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,auto)}.product[data-responsive=Constrained] .dialog{width:min(88%,480px)}.product[data-responsive=Constrained] .dialog .actions{flex-direction:column}.product[data-reduce-motion=true] *{animation:none!important;transition:none!important}.product[data-reduce-motion=true] .halo{transform:scale(var(--step-scale,1))!important}
@keyframes stars{0%{opacity:0}35%{opacity:.4}100%{opacity:0}}@media(max-width:1050px){.app{grid-template-columns:1fr 330px}.product-surface{padding-left:24px;padding-right:24px}}
</style>
</head>
<body>
<div class="scope">web_design_validation_only · device validation not_performed</div>
<div class="app">
  <main id="product" class="product" data-state="S0_ORIENTATION" data-responsive="Large" data-reduce-motion="false" aria-live="polite">
    <div id="world" class="world"><div id="stars" class="stars"></div><div class="sea"></div></div>
    <section id="surface" class="product-surface"></section>
    <aside id="demo" class="demo-layer" aria-label="设计事实演示"></aside>
  </main>
  <aside class="audit" aria-label="Web validation controls">
    <h1>TideBeacon 验证台</h1><p>此面板不属于产品表面；首屏产品面仅计 <code>[data-product-element]</code>。</p>
    <h2>状态 / 精确 transition ID</h2>
    <div class="audit-grid"><select id="stateSelect" aria-label="状态"></select><button id="forceState">呈现状态</button></div>
    <div id="transitionButtons" class="pillrow" style="margin-top:8px"></div>
    <output id="transitionLog" class="statusbox">launch → S0_ORIENTATION</output>
    <h2>Binding-specific 数据模式</h2>
    <label>绑定<select id="bindingSelect"></select></label>
    <div class="audit-grid" style="margin-top:8px"><button data-mode="normal">normal</button><button data-mode="fallback">fallback</button><button data-mode="error">error</button><button id="closeDemo">关闭演示</button></div>
    <output id="bindingLog" class="statusbox">选择绑定和模式</output>
    <h2>Variants / component states / stacking</h2>
    <label>组件<select id="componentSelect"></select></label><div id="demoButtons" class="pillrow" style="margin-top:8px"></div>
    <h2>窗口与动态</h2>
    <div class="pillrow"><button data-responsive="Large">Large/max</button><button data-responsive="Compact">Compact/default</button><button data-responsive="Constrained">Constrained/min</button><button id="motionToggle">Reduce Motion</button></div>
    <h2>QA 路径</h2>
    <div class="pillrow"><button id="qaScene">场景选择路径</button><button id="qaPractice">练习路径</button><button id="qaComplete">完成路径</button><button id="qaStageFail">Stage 失败</button><button id="qaSaveFail">强制存储失败</button></div>
    <output id="qaLog" class="statusbox">first-view product elements: <span id="firstCount"></span></output>
  </aside>
</div>
<script>
"use strict";
const STATES=["S0_ORIENTATION","S1_SETUP","S2_ENTRY_CONFIRM","S3_PRACTICE","S4_PAUSED","S5_RESTART_CONFIRM","S6_EXIT_CONFIRM","S7_COMPLETE","S8_SAVE_RESULT","S9_STAGE_ERROR"];
const TRANSITIONS={
 "TR-01":{from:["S0_ORIENTATION"],to:"S1_SETUP",action:"ack instruction"},"TR-03":{from:["S1_SETUP"],to:"S2_ENTRY_CONFIRM",confirm:"entry"},"TR-04":{from:["S2_ENTRY_CONFIRM"],to:"S3_PRACTICE",action:"start timeline"},"TR-05":{from:["S2_ENTRY_CONFIRM"],restore:true},
 "TR-06":{from:["S3_PRACTICE"],to:"S4_PAUSED",action:"freeze"},"TR-07":{from:["S4_PAUSED"],to:"S3_PRACTICE",action:"resume fade"},"TR-08":{from:["S3_PRACTICE","S4_PAUSED","S7_COMPLETE"],to:"S5_RESTART_CONFIRM",confirm:"restart"},"TR-09":{from:["S5_RESTART_CONFIRM"],to:"S1_SETUP",action:"reset"},"TR-10":{from:["S5_RESTART_CONFIRM"],restore:true},
 "TR-12":{from:["S3_PRACTICE"],to:"S3_PRACTICE",action:"queue pattern"},"TR-13":{from:["S3_PRACTICE","S4_PAUSED"],to:"S5_RESTART_CONFIRM",confirm:"restart"},"TR-15":{from:["S3_PRACTICE","S4_PAUSED"],to:"S6_EXIT_CONFIRM",confirm:"exit"},"TR-16":{from:["S6_EXIT_CONFIRM"],restore:true},"TR-17":{from:["S6_EXIT_CONFIRM"],to:"S1_SETUP",action:"close stage"},
 "TR-18":{from:["S3_PRACTICE"],to:"S7_COMPLETE",action:"complete"},"TR-19":{from:["S7_COMPLETE","S8_SAVE_RESULT"],to:"S8_SAVE_RESULT",action:"local write readback"},"TR-20":{from:["S8_SAVE_RESULT"],to:"S7_COMPLETE"},"TR-21":{from:["S7_COMPLETE","S8_SAVE_RESULT"],to:"S1_SETUP"},"TR-22":{from:["S2_ENTRY_CONFIRM"],to:"S9_STAGE_ERROR",action:"entry error"},"TR-23":{from:["S9_STAGE_ERROR"],to:"S1_SETUP",action:"restore setup"}
};
const COMPONENTS={
 C1:{variants:["orientation","practice","reducedMotion"],states:["orientation","active","hold","paused","error"],stack:"error>paused>hold>active"},
 C2:{variants:["LargePreview","CompactRows","ConstrainedSteps","controllerFocus"],states:["default","focused","selected","disabled","error"],stack:"error>disabled>focused+selected>selected>focused"},
 C3:{variants:["running","paused","patternQueued","ConstrainedWrap"],states:["hidden","default","focused","paused","disabled"],stack:"C4>C6>paused>focused>default>hidden"},
 C4:{variants:["entry","restart","exit","cancelOnlyError"],states:["open","cancelFocused","confirmFocused","committing","error"],stack:"error>committing>focus>open"},
 C5:{variants:["unsaved","saving","saved","saveFailed"],states:["default","saving","saved","failed","focused"],stack:"failed/saved>saving>focused>default"},
 C6:{variants:["durationError","sceneFallback","patternError","timelinePaused","stageEntryError","saveFailure"],states:["hidden","fallback","error","focused","recovering"],stack:"C4>C6error>C6fallback>content"}
};
const BINDINGS={
 "scene.lighthouse":{target:"c1-lighthouse",type:"display",normal:"procedural lighthouse",fallback:"opaque prism",error:"△ 灯塔未加载"},
 "timeline.phaseProgress":{target:"c1-halo",type:"semantic",normal:"0.42 · expanding",fallback:"freeze last 0.42",error:"□ 节奏已暂停"},
 "firstRun.copy":{target:"c1-instruction",type:"display",normal:"光扩张时吸气，光收回时呼气。",fallback:"光扩张时吸气，光收回时呼气。",error:"光扩张时吸气，光收回时呼气。"},
 "timeline.currentPhase":{target:"c1-phase",type:"semantic",normal:"吸气",fallback:"节奏已暂停",error:"□ 节奏已暂停"},
 "timeline.remainingMs":{target:"c1-countdown",type:"display",normal:"01:42",fallback:"01:42 / --:--",error:"停止递减 · △ 时间轴异常"},
 "playback.visualScale/audioGain":{target:"c1-halo",type:"semantic",normal:"scale .86 / gain .72",fallback:"last valid / muted",error:"force pause / mute"},
 "cycleAccent.completedCycle":{target:"stars",type:"semantic",normal:"complete cycle · subtle stars",fallback:"omit accent",error:"omit · cycle diagnostic"},
 "orientation.continueTransitionId":{target:"c1-lighthouse",type:"semantic",normal:"TR-01 exact dispatch",fallback:"built-in TR-01",error:"built-in TR-01 · never array index"},
 "selection.duration":{target:"c2-duration",type:"semantic",normal:"2分钟 selected",fallback:"2分钟 visible default",error:"duration invalid · start disabled"},
 "selection.scene":{target:"c2-scene",type:"semantic",normal:"海面 selected",fallback:"sea swatch",error:"scene preview broken · labels usable"},
 "selection.pattern":{target:"c2-pattern",type:"semantic",normal:"舒缓 selected",fallback:"舒缓 default",error:"pattern invalid · start disabled"},
 "pattern.phaseDurations":{target:"c2-pattern-detail",type:"display",normal:"4·1·6·1 秒",fallback:"详细时长暂不可用",error:"invalid values hidden"},
 "selection.valid":{target:"c2-start",type:"semantic",normal:"true · enabled",fallback:"false · disabled",error:"false · 请完成选择"},
 "timeline.runState":{target:"c3-status",type:"semantic",normal:"○ 进行中",fallback:"□ 已暂停",error:"□ 强制暂停 · timeline error"},
 "queuedPattern":{target:"c3-rhythm",type:"display",normal:"均衡（待重新开始）",fallback:"未更改",error:"queue cleared · active unchanged"},
 "timeline.canRestart":{target:"c3-restart",type:"semantic",normal:"true",fallback:"false",error:"false · restart unavailable"},
 "stage.canExit":{target:"c3-exit",type:"semantic",normal:"true",fallback:"system Back remains",error:"stable system exit + stage notice"},
 "pauseSnapshot":{target:"c3-status",type:"semantic",normal:"phase=exhale,elapsed=38420",fallback:"last safe paused",error:"remain paused · snapshot invalid"},
 "confirmation.kind":{target:"c4-title",type:"semantic",normal:"进入练习",fallback:"确认操作",error:"cancel-only"},
 "confirmation.body":{target:"c4-body",type:"display",normal:"将进入全空间并开始同一时间轴。",fallback:"确认或返回",error:"无法确认；返回不会改变先前状态。"},
 "confirmation.cancelTransitionId":{target:"c4-cancel",type:"semantic",normal:"TR-05 exact",fallback:"snapshot-close",error:"safe cancel + diagnostic"},
 "confirmation.confirmTransitionId":{target:"c4-confirm",type:"semantic",normal:"TR-04 exact",fallback:"disabled",error:"no commit + diagnostic"},
 "confirmation.snapshot":{target:"c4-body",type:"semantic",normal:"full prior snapshot",fallback:"captured in-memory prior",error:"no mutation · safe return"},
 "completion.copy":{target:"c5-copy",type:"display",normal:"完成一次练习",fallback:"完成一次练习",error:"完成一次练习"},
 "record.canSave":{target:"c5-save",type:"semantic",normal:"true",fallback:"false · local record unavailable",error:"false · exit/restart remain"},
 "record.writeResult":{target:"c5-result",type:"semantic",normal:"◇ 已保存（回读一致）",fallback:"not attempted · hidden",error:"△ 未保存 · 可重试"},
 "completion.canRestart":{target:"c5-restart",type:"semantic",normal:"true",fallback:"false",error:"false · exit remains"},
 "completion.canExit":{target:"c5-exit",type:"semantic",normal:"true",fallback:"system exit",error:"system exit"},
 "bindingStatus.semantic":{target:"c6-shape",type:"semantic",normal:"◇ mapped",fallback:"▢ dashed unavailable",error:"△ error"},
 "bindingStatus.message":{target:"c6-message",type:"display",normal:"场景预览已使用海面占位",fallback:"此项暂不可用",error:"具体：时长/场景/节奏/时间轴/Stage/保存失败"},
 "bindingStatus.recoveryAction":{target:"c6-action",type:"semantic",normal:"exact recovery action",fallback:"safe return",error:"unsafe retry hidden · exit preserved"}
};
const app={state:"S0_ORIENTATION",selection:{duration:2,scene:"sea",pattern:"舒缓"},timeline:{elapsed:0,remaining:120000,phase:"吸气",progress:0,running:false,gain:0},queuedPattern:null,snapshot:null,dialog:null,saveResult:null,forceSaveFailure:false,responsive:"Large",reduceMotion:false,lastFrame:performance.now()};
const $=s=>document.querySelector(s), product=$("#product"),surface=$("#surface"),world=$("#world"),demo=$("#demo");
const esc=s=>String(s).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function snapshot(){return JSON.parse(JSON.stringify({state:app.state,selection:app.selection,timeline:app.timeline,queuedPattern:app.queuedPattern,controlsVisible:app.state==="S4_PAUSED"||app.state==="S3_PRACTICE"}));}
function sameSnapshot(a,b){return JSON.stringify(a)===JSON.stringify(b)}
function dispatch(id){
 const t=TRANSITIONS[id];if(!t){log(`REJECT unknown exact ID ${id}`);return false}if(!t.from.includes(app.state)){log(`REJECT ${id}: ${app.state} not in ${t.from.join("/")}`);return false}
 if(t.confirm){app.snapshot=snapshot();app.dialog={kind:t.confirm,cancel:{entry:"TR-05",restart:"TR-10",exit:"TR-16"}[t.confirm],confirm:{entry:"TR-04",restart:"TR-09",exit:"TR-17"}[t.confirm]};}
 if(t.restore){const before=app.snapshot;if(!before){log(`${id} blocked: no snapshot`);return false}Object.assign(app,JSON.parse(JSON.stringify(before)));app.snapshot=null;app.dialog=null;render();log(`${id} exact restore=${sameSnapshot(snapshot(),before)}`);return true}
 if(id==="TR-04"){app.timeline={elapsed:0,remaining:app.selection.duration*60000,phase:"吸气",progress:0,running:true,gain:0};app.dialog=null;app.snapshot=null}
 if(id==="TR-06"){app.timeline.running=false}
 if(id==="TR-07"){app.timeline.running=true;app.timeline.gain=0;fadeGain()}
 if(id==="TR-09"){app.timeline={elapsed:0,remaining:app.selection.duration*60000,phase:"吸气",progress:0,running:false,gain:0};app.queuedPattern=null;app.dialog=null;app.snapshot=null}
 if(id==="TR-12"){app.queuedPattern=app.queuedPattern?null:"均衡"}
 if(id==="TR-17"){app.dialog=null;app.snapshot=null;app.timeline.running=false}
 if(id==="TR-18"){app.timeline.running=false;app.timeline.remaining=0;cycleAccent()}
 if(id==="TR-19"){saveRecord()}
 if(id==="TR-21")app.timeline.running=false;
 app.state=t.to;render();log(`${id} → ${app.state} (${t.action||"state"})`);return true
}
function log(s){$("#transitionLog").textContent=s}
function button(label,id,klass=""){return `<button class="${klass}" data-transition="${id}">${label}</button>`}
function beacon(orientation=false){const active=app.timeline.phase==="吸气"?1+app.timeline.progress*.18:1.18-app.timeline.progress*.18;return `<section class="beacon-guide" data-component="C1" data-variant="${orientation?"orientation":"practice"}" data-component-state="${app.state==="S4_PAUSED"?"paused":"active"}" style="--halo-scale:${active};--step-scale:${active>1.09?1.18:1}"><div id="c1-halo" data-preview-id="c1-halo" data-product-element class="halo" aria-label="光晕"></div><div id="c1-lighthouse" data-preview-id="c1-lighthouse" data-product-element class="lighthouse" ${orientation?'role="button" tabindex="0" data-transition="TR-01" aria-label="灯塔，继续"':""}></div>${orientation?'<p id="c1-instruction" data-preview-id="c1-instruction" data-product-element class="instruction">光扩张时吸气，光收回时呼气。</p>':`<div><div id="c1-phase" data-preview-id="c1-phase" class="phase">${app.state==="S4_PAUSED"?"节奏已暂停":app.timeline.phase}</div><div id="c1-countdown" data-preview-id="c1-countdown" class="countdown">${fmt(app.timeline.remaining)}</div></div>`}</section>`}
function setup(){return `<section class="panel setup" data-component="C2" data-variant="${app.responsive==="Large"?"LargePreview":app.responsive==="Compact"?"CompactRows":"ConstrainedSteps"}" data-component-state="default"><div id="c2-duration" data-preview-id="c2-duration" class="choice active-group"><strong>时长</strong>${[2,4,6].map(v=>`<button data-choice="duration" data-value="${v}" aria-pressed="${app.selection.duration==v}">${v}分钟</button>`).join("")}</div><div id="c2-scene" data-preview-id="c2-scene" class="choice"><strong>场景</strong>${[["sea","海面"],["cloud","云层"],["dune","沙丘"]].map(([v,l])=>`<button class="preview-swatch" data-choice="scene" data-value="${v}" aria-pressed="${app.selection.scene==v}">${l}</button>`).join("")}</div><div id="c2-pattern" data-preview-id="c2-pattern" class="choice"><strong>节奏</strong>${["舒缓","均衡","深长"].map(v=>`<button data-choice="pattern" data-value="${v}" aria-pressed="${app.selection.pattern==v}">${v}</button>`).join("")}</div><div id="c2-pattern-detail" data-preview-id="c2-pattern-detail" class="pattern-detail">吸气·停留·呼气·停留　4·1·6·1 秒</div><div class="actions"><button id="c2-start" data-preview-id="c2-start" class="primary" data-transition="TR-03">开始练习</button></div></section>`}
function controls(){return `<section class="panel controls" data-component="C3" data-variant="${app.state==="S4_PAUSED"?"paused":app.queuedPattern?"patternQueued":"running"}" data-component-state="${app.state==="S4_PAUSED"?"paused":"default"}"><span id="c3-status" data-preview-id="c3-status">${app.state==="S4_PAUSED"?"□ 已暂停":"○ 进行中"}</span>${button(app.state==="S4_PAUSED"?"继续":"暂停",app.state==="S4_PAUSED"?"TR-07":"TR-06","primary").replace("<button",'<button id="c3-pause" data-preview-id="c3-pause"')}<button id="c3-rhythm" data-preview-id="c3-rhythm" data-transition="TR-12">节奏${app.queuedPattern?" · 均衡待启用":""}</button><button id="c3-restart" data-preview-id="c3-restart" data-transition="TR-08">重新开始</button><button id="c3-exit" data-preview-id="c3-exit" data-transition="TR-15">退出</button></section>`}
function dialog(){const d=app.dialog||{kind:"entry",cancel:"TR-05",confirm:"TR-04"},copy={entry:["进入练习","将进入全空间并开始同一时间轴。"],restart:["重新开始","当前进度将重置；返回可保留原状态。"],exit:["退出练习","退出将返回场景选择；返回可保留原状态。"]}[d.kind];return `<div class="dialog-backdrop"><section class="dialog" role="dialog" aria-modal="true" data-component="C4" data-variant="${d.kind}" data-component-state="open"><h2 id="c4-title" data-preview-id="c4-title">${copy[0]}</h2><p id="c4-body" data-preview-id="c4-body">${copy[1]}</p><div class="actions"><button id="c4-cancel" data-preview-id="c4-cancel" data-transition="${d.cancel}">返回</button><button id="c4-confirm" data-preview-id="c4-confirm" class="primary" data-transition="${d.confirm}">确认</button></div></section></div>`}
function completion(){return `<section class="panel completion" data-component="C5" data-variant="${app.saveResult?.ok?"saved":app.saveResult?"saveFailed":"unsaved"}" data-component-state="${app.saveResult?.ok?"saved":app.saveResult?"failed":"default"}"><h2 id="c5-copy" data-preview-id="c5-copy">完成一次练习</h2><div class="actions"><button id="c5-save" data-preview-id="c5-save" class="primary" data-transition="TR-19">保存本地记录</button><button id="c5-restart" data-preview-id="c5-restart" data-transition="TR-08">再来一次</button><button id="c5-exit" data-preview-id="c5-exit" data-transition="TR-21">结束</button></div><p id="c5-result" data-preview-id="c5-result" aria-live="polite">${app.saveResult?(app.saveResult.ok?"◇ 已保存（写入与回读一致）":"△ 未保存（"+esc(app.saveResult.reason)+"）"):""}</p></section>`}
function notice(kind,msg,action,id){return `<section class="notice ${kind}" data-component="C6" data-variant="${kind==="error"?"stageEntryError":"sceneFallback"}" data-component-state="${kind}"><span id="c6-shape" data-preview-id="c6-shape" class="shape" aria-hidden="true"></span><span id="c6-message" data-preview-id="c6-message">${msg}</span>${action?`<button id="c6-action" data-preview-id="c6-action" data-transition="${id}">${action}</button>`:""}</section>`}
function render(){product.dataset.state=app.state;product.dataset.responsive=app.responsive;product.dataset.reduceMotion=String(app.reduceMotion);world.className=`world scene-${app.selection.scene}`;let html="";
 if(app.state==="S0_ORIENTATION")html=beacon(true);
 if(app.state==="S1_SETUP")html=setup();
 if(app.state==="S2_ENTRY_CONFIRM")html=setup()+dialog();
 if(app.state==="S3_PRACTICE"||app.state==="S4_PAUSED")html=beacon(false)+controls();
 if(app.state==="S5_RESTART_CONFIRM"||app.state==="S6_EXIT_CONFIRM")html=beacon(false)+controls()+dialog();
 if(app.state==="S7_COMPLETE"||app.state==="S8_SAVE_RESULT")html=completion();
 if(app.state==="S9_STAGE_ERROR")html=notice("error","Stage 未能进入；场景选择保持不变。","返回选择","TR-23");surface.innerHTML=html;$("#stateSelect").value=app.state;const firstCount=$("#firstCount");if(firstCount)firstCount.textContent=app.state==="S0_ORIENTATION"?surface.querySelectorAll("[data-product-element]").length:"仅 S0 计数";
}
function fmt(ms){const s=Math.max(0,Math.ceil(ms/1000));return `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`}
function tick(now){const dt=Math.min(100,now-app.lastFrame);app.lastFrame=now;if(app.state==="S3_PRACTICE"&&app.timeline.running){app.timeline.elapsed+=dt;app.timeline.remaining-=dt;const cycle=12000,pos=app.timeline.elapsed%cycle;if(pos<4000){app.timeline.phase="吸气";app.timeline.progress=pos/4000}else if(pos<5000){app.timeline.phase="停留";app.timeline.progress=1}else if(pos<11000){app.timeline.phase="呼气";app.timeline.progress=(pos-5000)/6000}else{app.timeline.phase="停留";app.timeline.progress=0}const ph=$("#c1-phase"),cd=$("#c1-countdown"),halo=$("#c1-halo");if(ph)ph.textContent=app.timeline.phase;if(cd)cd.textContent=fmt(app.timeline.remaining);if(halo){const scale=app.timeline.phase==="吸气"?1+app.timeline.progress*.18:app.timeline.phase==="呼气"?1.18-app.timeline.progress*.18:(app.timeline.progress?1.18:1);halo.style.setProperty("--halo-scale",scale);halo.style.setProperty("--step-scale",scale>1.09?1.18:1)}if(app.timeline.remaining<=0)dispatch("TR-18")}requestAnimationFrame(tick)}
function fadeGain(){let start=performance.now();function f(n){if(app.state!=="S3_PRACTICE")return;app.timeline.gain=Math.min(1,(n-start)/350);if(app.timeline.gain<1)requestAnimationFrame(f)}requestAnimationFrame(f)}
function cycleAccent(){const s=$("#stars");s.classList.remove("accent");requestAnimationFrame(()=>s.classList.add("accent"))}
function saveRecord(){try{if(app.forceSaveFailure)throw new Error("forced QA failure");const key="tidebeacon.localPracticeRecord";const value=JSON.stringify({completedAt:new Date().toISOString(),durationMinutes:app.selection.duration,scene:app.selection.scene,pattern:app.selection.pattern});localStorage.setItem(key,value);const read=localStorage.getItem(key);if(read!==value)throw new Error("readback mismatch");app.saveResult={ok:true,key,readback:true}}catch(e){app.saveResult={ok:false,reason:e.message}}}
function showBinding(path,mode){const b=BINDINGS[path],value=b[mode];demo.className="demo-layer show";demo.innerHTML=`<section data-binding="${esc(path)}" data-mode="${mode}" data-binding-target="${b.target}" class="notice ${mode==="error"?"error":mode==="fallback"?"fallback":""}"><span class="shape"></span><div><code>${esc(path)}</code> → <code>[data-preview-id=${b.target}]</code><br><strong>${esc(value)}</strong><br>${b.type}</div></section>`;$("#bindingLog").textContent=`${path} / ${mode}: ${value}`;const target=document.querySelector(`[data-preview-id="${b.target}"]`);if(target){target.dataset.binding=path;target.dataset.mode=mode;target.setAttribute("aria-label",value);if(["c1-instruction","c1-phase","c1-countdown","c2-pattern-detail","c3-status","c4-title","c4-body","c5-copy","c5-result","c6-message"].includes(b.target))target.textContent=value;if(target.tagName==="BUTTON")target.disabled=mode!=="normal"&&/false|disabled|no commit|unavailable/.test(value)}if(path==="cycleAccent.completedCycle"&&mode==="normal")cycleAccent()}
function showComponentDemo(component,kind,value){demo.className="demo-layer show";demo.innerHTML=`<section data-component="${component}" data-demo-kind="${kind}" data-demo-value="${esc(value)}" ${kind==="variant"?`data-variant="${esc(value)}"`:kind==="state"?`data-component-state="${esc(value)}"`:`data-stack="${esc(value)}"`}><h3>${component} · ${kind}</h3><p><code>${esc(value)}</code></p><div class="notice ${/error|failed/.test(value)?"error":"fallback"}"><span class="shape"></span><span>已触发并渲染声明的稳定 selector；语义形状与文字同时可见。</span></div></section>`}
function buildAudit(){STATES.forEach(s=>$("#stateSelect").insertAdjacentHTML("beforeend",`<option>${s}</option>`));Object.keys(TRANSITIONS).forEach(id=>$("#transitionButtons").insertAdjacentHTML("beforeend",`<button data-transition="${id}">${id}</button>`));Object.keys(BINDINGS).forEach(p=>$("#bindingSelect").insertAdjacentHTML("beforeend",`<option>${p}</option>`));Object.keys(COMPONENTS).forEach(c=>$("#componentSelect").insertAdjacentHTML("beforeend",`<option>${c}</option>`));buildDemoButtons()}
function buildDemoButtons(){const c=$("#componentSelect").value||"C1",x=COMPONENTS[c],box=$("#demoButtons");box.innerHTML="";x.variants.forEach(v=>box.insertAdjacentHTML("beforeend",`<button data-demo-kind="variant" data-demo-value="${v}">v:${v}</button>`));x.states.forEach(v=>box.insertAdjacentHTML("beforeend",`<button data-demo-kind="state" data-demo-value="${v}">s:${v}</button>`));box.insertAdjacentHTML("beforeend",`<button data-demo-kind="stack" data-demo-value="${x.stack}">stack</button>`)}
function qaLog(message){$("#qaLog").innerHTML=`first-view product elements: <span id="firstCount">${app.state==="S0_ORIENTATION"?surface.querySelectorAll("[data-product-element]").length:"仅 S0 计数"}</span><br>${esc(message)}`}
document.addEventListener("click",e=>{const t=e.target.closest("button,[role=button]");if(!t)return;if(t.dataset.transition){dispatch(t.dataset.transition);return}if(t.dataset.choice){app.selection[t.dataset.choice]=t.dataset.value;render();return}if(t.dataset.mode){showBinding($("#bindingSelect").value,t.dataset.mode);return}if(t.dataset.demoKind){showComponentDemo($("#componentSelect").value,t.dataset.demoKind,t.dataset.demoValue);return}if(t.dataset.responsive){app.responsive=t.dataset.responsive;render();return}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"){const f=document.activeElement;if(f?.dataset.transition)dispatch(f.dataset.transition)}if(e.key==="Escape"){if(["S2_ENTRY_CONFIRM","S5_RESTART_CONFIRM","S6_EXIT_CONFIRM"].includes(app.state))dispatch({S2_ENTRY_CONFIRM:"TR-05",S5_RESTART_CONFIRM:"TR-10",S6_EXIT_CONFIRM:"TR-16"}[app.state]);else if(["S3_PRACTICE","S4_PAUSED"].includes(app.state))dispatch("TR-15")}if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.key)){const list=[...document.querySelectorAll("button:not([disabled]),[role=button]")],i=list.indexOf(document.activeElement);if(i>=0){e.preventDefault();list[(i+(e.key==="ArrowLeft"||e.key==="ArrowUp"?-1:1)+list.length)%list.length].focus()}}});
$("#forceState").onclick=()=>{app.state=$("#stateSelect").value;if(app.state.includes("CONFIRM")){app.snapshot=snapshot();app.dialog={kind:app.state==="S2_ENTRY_CONFIRM"?"entry":app.state==="S5_RESTART_CONFIRM"?"restart":"exit",cancel:app.state==="S2_ENTRY_CONFIRM"?"TR-05":app.state==="S5_RESTART_CONFIRM"?"TR-10":"TR-16",confirm:app.state==="S2_ENTRY_CONFIRM"?"TR-04":app.state==="S5_RESTART_CONFIRM"?"TR-09":"TR-17"}}render();log(`direct state presentation: ${app.state}`)};
$("#componentSelect").onchange=buildDemoButtons;$("#closeDemo").onclick=()=>demo.className="demo-layer";$("#motionToggle").onclick=()=>{app.reduceMotion=!app.reduceMotion;render();log(`Reduce Motion=${app.reduceMotion}`)};
$("#qaScene").onclick=()=>{app.state="S0_ORIENTATION";render();dispatch("TR-01");qaLog("real path: TR-01 → S1_SETUP; screenshot target scene-selection")};
$("#qaPractice").onclick=()=>{app.state="S1_SETUP";render();dispatch("TR-03");dispatch("TR-04");qaLog("real path: TR-03 → confirmation → exact TR-04 → S3_PRACTICE")};
$("#qaComplete").onclick=()=>{app.state="S3_PRACTICE";app.timeline.running=true;render();dispatch("TR-18");qaLog("real timeline completion transition TR-18 → S7_COMPLETE")};
$("#qaStageFail").onclick=()=>{app.state="S1_SETUP";render();dispatch("TR-03");dispatch("TR-22")};
$("#qaSaveFail").onclick=()=>{app.forceSaveFailure=true;app.state="S7_COMPLETE";render();dispatch("TR-19");render();qaLog("forced write failure; observable failure and retry/exit remain")};
buildAudit();render();requestAnimationFrame(tick);
</script>
</body>
</html>

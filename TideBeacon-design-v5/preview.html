.reduce-motion button.focused{transform:none}.loading::after{content:'加载中…';display:block;color:var(--muted)}.empty::after{content:'暂无可显示内容';display:block;color:var(--muted)}[data-stacking]{box-shadow:0 0 0 4px #ffd89a66 inset}.binding-status{margin:8px auto;padding:8px;max-width:720px;border:1px dashed #7890aa;color:var(--muted)}.mode-fallback #app{font-size:125%}.mode-error #app,.constrained #app{font-size:150%}input.focused{outline:3px solid var(--accent);transform:scale(1.15)}input.selected{outline:3px solid var(--accent);background:var(--accent)}.reduce-motion input.focused{transform:none}#app[data-responsive="large"] .window{width:1216px;min-height:736px;max-width:calc(100vw - 32px);max-height:calc(100vh - 100px)}#app[data-responsive="compact"] .window{width:896px;min-height:656px;max-width:calc(100vw - 32px);max-height:calc(100vh - 100px);overflow:auto}#app[data-responsive="constrained"] .window{width:896px;height:656px;max-width:calc(100vw - 32px);max-height:calc(100vh - 100px);overflow:auto}

<nav id="tools"><b>Web 设计验证</b><button data-set-state="S0">首次</button><button data-set-state="S1">选择</button><button data-set-state="S3">练习</button><button data-action="X04">暂停</button><button data-system-pause>系统挂起</button><button data-system-back>手柄 B / Back</button><button data-set-state="S7">完成</button><select id="responsive"><option value="large">Large</option><option value="compact">Compact</option><option value="constrained">Constrained</option></select><select id="dataMode"><option>normal</option><option>fallback</option><option>error</option></select><label><input id="reduce" type="checkbox"> Reduce Motion</label><label><input id="stackDemo" type="checkbox"> 组合状态</label><select id="component"><option>C1</option><option>C2</option><option>C3</option><option>C4</option><option>C5</option><option>C6</option><option>C7</option></select><select id="compState"><option>default</option><option>focused</option><option>pressed</option><option>disabled</option><option>loading</option><option>empty</option><option>error</option><option>overflow</option><option>inhale</option><option>hold1</option><option>exhale</option><option>hold2</option><option>paused</option><option>performance</option><option>recorded</option><option>exit-focused</option><option>exit-pressed</option></select></nav>
<main id="app" data-state="S0" data-responsive="large" data-content-area="1216x736"></main><details id="binding-evidence" class="binding-evidence"><summary>30 bindings evidence</summary></details><output id="audit-status" class="audit">state=S0 · normal · large</output>
<script>
const state={id:'S0',scene:'sea',duration:120,pattern:'calm',elapsed:0,startMono:0,pausedAt:0,pausedAccum:0,cycleIndex:0,paused:true,snapshotValid:true,audioFadeUntil:0,record:localStorage.getItem('tidebeacon.localRecord')==='saved',recordState:'unrecorded',pending:null,dataMode:'normal',responsive:'large',reduce:false,component:'C1',compState:'default',stackDemo:false};
const phaseSets={calm:[['吸气','inhale',4000],['停留','hold',1000],['呼气','exhale',6000],['停留','hold',1000]],even:[['吸气','inhale',4000],['停留','hold',1000],['呼气','exhale',4000],['停留','hold',1000]],long:[['吸气','inhale',3500],['停留','hold',1000],['呼气','exhale',7500],['停留','hold',1000]]};
const $=s=>document.querySelector(s), app=$('#app'), esc=s=>String(s).replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]));
const el=(id,label,type='div',bind='')=>`<${type} data-preview-id="${id}" ${bind?`data-binding="${bind}"`:''}>${label}</${type}>`;
function mode(normal,fallback,error=fallback){return state.dataMode==='normal'?normal:state.dataMode==='fallback'?fallback:error}
function lighthouse(){let amp=state.reduce?.06:.28;return `<div class="lighthouse" data-preview-id="intro.lighthouse" data-binding="phasePreview" data-motion-amplitude="${amp}"><i class="beam"></i><i class="halo" data-preview-id="intro.halo" data-binding="phasePreview" style="--halo:${state.reduce?.96:1}"></i></div>`}
function c1(){let copy='光扩张时吸气，光收回时呼气。';return `<section class="window hero" data-component="C1">${lighthouse().replace('data-preview-id="intro.halo"','data-preview-id="intro.halo" data-action="X01" tabindex="0" role="button" aria-label="确认已理解光环节奏"')}${el('intro.copy',copy,'p','instructionCopy')}</section>`}
function option(id,label,val,key){return `<button data-preview-id="${id}" data-binding="config.${key}" data-pick="${key}:${val}" class="${state[key]==val?'selected':''}">${label}</button>`}
function c2(){let assetNote=mode('程序化低多边形占位已就绪','使用低细节安全占位','场景资源不可用，已切换海面占位');return `<section class="panel" data-component="C2">${el('scene.title','选择场景','h2')}<div class="grid" data-binding="sceneAssets">${[['sea','海面'],['cloud','云层'],['dune','沙丘']].map(([v,l])=>`<button class="scene-card ${state.scene===v?'selected':''}" data-preview-id="scene.${v}" data-binding="config.scene" data-pick="scene:${v}"><i class="swatch ${state.dataMode==='error'?'':v}"></i>${l}</button>`).join('')}</div><p class="binding-status" data-preview-id="scene.assetStatus">${assetNote}</p></section>`}
function c3(){let valid=state.dataMode==='normal',scale=state.dataMode==='normal'?'100%':state.dataMode==='fallback'?'125%':'150%';return `<section class="panel" data-component="C3" style="font-size:${scale}">${el('session.duration','时长','h3','durationSec')}<div class="choices">${option('duration.2','2 分钟',120,'duration')}${option('duration.4','4 分钟',240,'duration')}${option('duration.6','6 分钟',360,'duration')}</div>${el('session.pattern','节奏','h3','pattern.label')}<div class="choices">${option('pattern.calm','舒缓','calm','pattern')}${option('pattern.even','均衡','even','pattern')}${option('pattern.long','深长','long','pattern')}</div><p><button data-preview-id="session.start" data-binding="configValid" data-action="X02" ${valid?'':'disabled'}>${valid?'开始':'配置不可用'}</button></p></section>`}
function c4(){let phases=phaseSets[state.pattern],total=phases.reduce((a,p)=>a+p[2],0),t=state.elapsed%total,cur=phases[0],acc=0;for(const p of phases){if(t<acc+p[2]){cur=p;break}acc+=p[2]}let prog=(t-acc)/cur[2],forced=state.component==='C4'?state.compState:'',unavailable=state.dataMode!=='normal'||['loading','empty','error'].includes(forced);if(['inhale','hold1','exhale','hold2','paused','performance'].includes(forced)){cur={inhale:['吸气','inhale',1],hold1:['停留','hold',1],exhale:['呼气','exhale',1],hold2:['停留','hold',1],paused:['已暂停','paused',1],performance:['呼气','exhale',1]}[forced];prog=.5}if(unavailable){cur=['节奏暂不可用','paused',1];prog=0;state.paused=true}let sc=unavailable?1:(cur[1]==='inhale'?0.7+prog*.55:cur[1]==='exhale'?1.25-prog*.55:cur[1]==='hold'?1.25:.7);if(state.reduce&&!unavailable)sc=.94+prog*.06;if(state.paused&&!unavailable||forced==='paused')cur=['已暂停','paused',1];let world=lighthouse().replace('intro.lighthouse','halo.lighthouse').replace('data-binding="phasePreview"','data-binding="config.scene"').replace('intro.halo','halo.ring').replace('data-binding="phasePreview"',`data-binding="phase progress" style="--halo:${sc}"`);let dust=(state.reduce||forced==='performance'||unavailable)?'':Array.from({length:Math.min(24,state.cycleIndex*3)},(_,i)=>`<i style="position:absolute;left:${(i*37)%95}%;top:${(i*53)%90}%">·</i>`).join('');return `<section class="stage ${state.scene} ${unavailable?'unavailable':''}" data-component="C4" data-binding="paused" data-audio-state="${state.paused?'frozen':'shared-timeline'}">${el('halo.dust',dust,'div','cycleIndex')}${world}<div class="phase" data-preview-id="halo.phase" data-binding="phase"><i class="shape ${cur[1]}"></i>${cur[0]}</div><div class="countdown" data-preview-id="halo.countdown" data-binding="remaining">${unavailable?'--:--':new Date(Math.max(0,state.duration*1000-state.elapsed)).toISOString().slice(14,19)}</div><button data-action="X04">暂停</button></section>`}
function c5(){return `<section class="modal" data-component="C5">${el('pause.status','已暂停','h2','snapshot.remaining')}<p>${state.snapshotValid?'时间已冻结':'快照不可用，保持暂停'}</p><div class="row"><button data-preview-id="pause.resume" data-binding="snapshot.valid" data-action="X05" ${state.snapshotValid?'':'disabled'}>继续</button><button data-preview-id="pause.restart" data-binding="pendingIntent" data-action="X06">重新开始</button><button class="danger" data-preview-id="pause.exit" data-binding="pendingIntent" data-action="X08">退出</button></div></section>`}
function c6(){let write=state.recordState==='error'?'写入失败，未记录':state.record?'已记录':'未记录';return `<section class="window hero" data-component="C6">${el('finish.copy','完成一次练习','h1')}<label><input data-preview-id="finish.record" data-binding="writeState" data-action="X11" type="checkbox" ${state.record?'checked':''}> 保存本地记录</label>${el('finish.status',write,'p','writeState')}<button data-preview-id="finish.exit" data-action="X12">退出</button></section>`}
function c7(){if(!['start','restart','exit'].includes(state.pending))return '';let p=state.pending,title={start:'开始',restart:'重新开始',exit:'退出'}[p],normal={start:`使用${state.scene==='sea'?'海面':state.scene==='cloud'?'云层':'沙丘'} · ${state.duration/60}分钟 · ${state.pattern}开始？`,restart:'将从头开始。',exit:'将退出本次练习。'}[p],tri=p==='start'?'':'<i class="semantic-triangle" aria-label="需确认"></i>';return `<section class="modal" data-component="C7" data-variant="${p}">${el('dialog.title',tri+title,'h2','pendingIntent')}${el('dialog.body',normal,'p','resolvedCopy config.summary')}<div class="row"><button data-preview-id="dialog.cancel" data-binding="pendingIntent" data-dialog="cancel">取消</button><button class="${p==='start'?'':'danger'}" data-preview-id="dialog.confirm" data-binding="pendingIntent" data-dialog="confirm">确认</button></div></section>`}
function renderScene(){app.dataset.state=state.id;app.dataset.responsive=state.responsive;app.dataset.contentArea={large:'1216x736',compact:'896x656',constrained:'896x656@150%'}[state.responsive];app.dataset.reduceMotion=String(state.reduce);app.dataset.audioState=state.paused?'frozen':performance.now()<state.audioFadeUntil?'resume-fade-400ms':'shared-timeline';app.dataset.textScaling=state.responsive==='constrained'?'150%':state.dataMode==='fallback'?'125%':state.dataMode==='error'?'150%':'100%';document.body.className=`${state.responsive} mode-${state.dataMode} ${state.reduce?'reduce-motion':''}`;let html='';if(state.id==='S0')html=c1();if(state.id==='S1')html=`<section class="window">${c2()}${c3()}</section>`;if(state.id==='S2')html=`<section class="window">${c2()}${c3()}</section>${c7()}`;if(state.id==='S3')html=c4();if(state.id==='S4')html=c4()+c5();if(state.id==='S5'||state.id==='S6')html=c4()+c5()+c7();if(state.id==='S7')html=c6();app.innerHTML=html;applyDemo();audit()}
function transition(id){let now=performance.now();if(id==='X01')state.id='S1';if(id==='X02'){state.id='S2';state.pending='start'}if(id==='X03'){state.id='S3';state.elapsed=0;state.startMono=now;state.pausedAccum=0;state.cycleIndex=0;state.paused=false;state.snapshotValid=true}if(id==='X04'){state.id='S4';state.paused=true;state.pausedAt=now;state.snapshotValid=state.dataMode==='normal'}if(id==='X05'&&state.snapshotValid){state.pausedAccum+=now-state.pausedAt;state.audioFadeUntil=now+400;state.id='S3';state.paused=false}if(id==='X06'){state.id='S5';state.pending='restart'}if(id==='X07'){state.id='S3';state.elapsed=0;state.startMono=now;state.pausedAccum=0;state.cycleIndex=0;state.pending=null;state.paused=false}if(id==='X08'){state.id='S6';state.pending='exit'}if(id==='X09'){state.id='S1';state.pending=null;state.paused=true}if(id==='X10'){state.id='S7';state.paused=true}if(id==='X11'){try{state.record=!state.record;if(state.record)localStorage.setItem('tidebeacon.localRecord',JSON.stringify({completedAt:new Date().toISOString(),duration:state.duration,scene:state.scene,pattern:state.pattern}));else localStorage.removeItem('tidebeacon.localRecord');state.recordState=state.record?'recorded':'unrecorded'}catch(_){state.record=false;state.recordState='error'}}if(id==='X12'){state.id='closed';app.dataset.state='closed';app.innerHTML='<div class="window hero" data-state="closed" data-preview-id="closed.banner">预览已退出</div>';audit();return}renderScene()}

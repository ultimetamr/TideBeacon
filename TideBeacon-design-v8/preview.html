if(current==='S1')h=base()+el('c1-instruction','光扩张时吸气，光收回时呼气。','instruction');
if(current==='S2')h=`<div class="selection"><div class="scene-preview">海面 · 程序化场景预览</div><div class="choices">${[['c2-duration','时长','2 分钟　4 分钟　6 分钟'],['c2-scene','场景','海面　云层　沙丘'],['c2-pattern','节奏','潮汐 4-1-6-1']].map(x=>el(x[0],`<div class="choice panel"><h3>${x[1]}</h3><div class="options"><button class="action selected">${x[2]}</button></div></div>`)).join('')}</div>${button('c3-start','开始','TR2','primary')}${mode!=='normal'?el('c3-status',mode==='error'?'选择无效，需要恢复':'选择未完成','semantic'):''}</div>`;
if(['S3','S4','S5'].includes(current)){let sem=current==='S4'?'<span class="shape square"></span>已暂停':current==='S5'?'<span class="shape diamond"></span>系统暂停':'进行中';h=base()+`<div class="metric">${el('c1-phase',current==='S3'?'吸气':current==='S4'?'已暂停':'系统暂停','phase')}${el('c1-countdown',mode==='error'?'--:--':'01:42','countdown')}${el('c1-lifecycle',sem,'semantic')}</div>`;if(current!=='S3'||componentDemo.c==='C4')h+=`<div class="controls panel">${button('c4-pause',current==='S4'?'继续':'暂停',current==='S4'?'TR4':'TR3')}${button('c4-pattern','节奏 · 潮汐','TR26')}${button('c4-restart','重新开始','TR12')}${button('c4-exit','退出','TR8','danger')}${current==='S5'?el('c4-system-status','◇ 系统暂停','semantic'):''}</div>`}
if(current==='S6'||current==='S7'){let restart=current==='S7';h=`<div class="dialog-backdrop"><div class="dialog panel" role="dialog">${el('c5-title',restart?'确认重新开始？':'确认退出？','')} ${el('c5-body',restart?'当前进度将重置。':'本次进度不会保留。','')}<div class="dialog-actions">${button('c5-cancel','取消',restart?'TR14':'TR10')}${button('c5-confirm','确认',restart?'TR13':'TR11a','danger')}</div></div></div>`}
if(current==='S8'||current==='S9'){let writing=componentDemo.c==='C6'&&componentDemo.s==='recording';h=`<div class="completion panel">${el('c6-copy','完成一次练习','')} ${button('c6-save','保存本地记录','TR15')}${writing?el('c6-spinner','◌ 正在保存','semantic'):''}${current==='S9'?el('c6-result',recordStatus==='saved'?'● 已保存本地记录':'◇ 未保存记录','semantic'):''}</div>`}
if(current==='S10'){let native=componentDemo.c==='C7'&&componentDemo.s==='nativeFallback',clock=componentDemo.s==='clock',over=componentDemo.s==='overflow';h=`<div class="recovery panel">${el('c7-icon','△ 需要恢复','semantic')}${el('c7-message',mode==='error'?'暂时无法继续。':'数据无效，已安全冻结。','')} ${over?el('c7-overflow','内容过长，可滚动','semantic'):''}<div class="row">${button('c7-action',native?'原生返回选择':'返回选择',native?'TR32':over?'TR31':'TR18')}${clock?button('c7-restart','重试重新开始','TR27'):''}${button('c7-exit',native?'原生安全退出':'安全退出',native?'TR33':'TR29','danger')}</div></div>`}
if(pendingConfirm){let entry=pendingConfirm==='TR2';h+=`<div class="dialog-backdrop" data-confirm-transition="${pendingConfirm}"><div class="dialog panel" role="dialog">${el('c5-title',entry?'确认进入练习？':'确认重试重新开始？','')}${el('c5-body',entry?'将进入全空间练习。':'将返回选择并重新初始化节奏。','')}<div class="dialog-actions">${button('c5-cancel','取消','cancel-pending')}${button('c5-confirm','确认','confirm-pending','danger')}</div></div></div>`}
let semantic=componentSemantics[componentDemo.c+':'+componentDemo.s]||componentDemo.s;if(!(current==='S1'&&((componentDemo.c==='C1'&&componentDemo.s==='default')||(componentDemo.c==='C1'&&componentDemo.s==='threshold')||(componentDemo.c==='C3'&&componentDemo.s==='haloContinuation')))){h+=`<div class="panel" data-component-proof="${componentDemo.c}:${componentDemo.s}" data-variant="${componentDemo.s}" style="position:absolute;right:18px;bottom:18px;max-width:420px;z-index:18"><b>${componentDemo.c} · ${componentDemo.s}</b><div class="semantic">${semantic}</div><div>${componentLabels[componentDemo.c].map((x,i)=>`<span data-component-demo-element="${componentDemo.c}-${i}" class="action" style="display:inline-block;margin:4px">${x}</span>`).join('')}</div></div>`}
scene.innerHTML=h;scene.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>fire(b.dataset.action));let ids=elements.filter(x=>x[0]===componentDemo.c).map(x=>x[1]),targets=ids.map(id=>scene.querySelector(`[data-preview-id="${id}"]`)).filter(Boolean);targets.forEach(t=>{t.dataset.componentState=componentDemo.s;t.classList.add('demo-'+componentDemo.s)});scene.insertAdjacentHTML('beforeend',`<div class="state-proof" data-component-proof="${componentDemo.c}:${componentDemo.s}">${componentDemo.c} · ${componentDemo.s}</div>`);if(componentDemo.s==='focused')targets[0]?.focus();if(componentDemo.s==='overflow')view.classList.add('overflow-mode');if(componentDemo.s==='systemPaused'&&current==='S3'){current='S5';render()}updateInspector()}
function fire(id){if(id==='cancel-pending'){pendingConfirm=null;render();return}if(id==='confirm-pending'){let confirmed=pendingConfirm;pendingConfirm=null;let ct=transitions.find(x=>x[0]===confirmed);current=ct[2];render();return}let t=transitions.find(x=>x[0]===id);if(!t)return;if(id==='TR2'||id==='TR27'){pendingConfirm=id;render();return}if(id==='TR5'){prior=current;current='S5';render();return}if(id==='TR6'){current=prior==='S4'?'S4':'S3';render();return}if(t[4]&&!['S6','S7'].includes(current)){prior=current;current=id==='TR12'||id==='TR26'?'S7':'S6';render();return}if(t[2]==='closed'){toast.textContent=`${id} · 已安全退出（演示保持页面）`;return}current=t[2]==='prior'?prior:t[2];if(id==='TR15'){componentDemo={c:'C6',s:'recording'};recordStatus='writing';render();setTimeout(()=>{try{if(mode==='error')throw new Error('preview storage failure');let records=JSON.parse(localStorage.getItem('tidebeacon.records')||'[]');records.push({id:'preview-'+Date.now(),completedAt:new Date().toISOString(),durationMinutes:2,sceneLabel:'海面',patternLabel:'潮汐'});localStorage.setItem('tidebeacon.records',JSON.stringify(records));recordStatus='saved';componentDemo.s='saved'}catch(e){recordStatus='notSaved';componentDemo.s='error'}current='S9';render()},500);return}render()}
function updateInspector(){let i=document.querySelector('#inspector');i.innerHTML=`<b>Coverage inspector</b><div>state=${current}; mode=${mode}; tier=${view.dataset.tier}; reduce=${reduce}; record=${recordStatus}</div>`+elements.map(x=>`<div class="item">${x[0]}.${x[1]} · ${x[2]} · ${scene.querySelector(`[data-preview-id="${x[1]}"]`)?'visible':'conditional-hide'}</div>`).join('')+bindingEvidence.map((x,n)=>`<div class="item" data-binding-id="${x.id}" data-binding-target="${x.target}" data-binding-type="${x.type}" data-binding-mode="${mode}">binding ${n+1} · ${x.id} → ${x.target} · ${mode==='normal'?x.normal:x.fallback}</div>`).join('')}
Object.entries(states).forEach(([id,n])=>{let b=document.createElement('button');b.textContent=id+' '+n;b.onclick=()=>{current=id;render()};document.querySelector('#stateButtons').append(b)});transitions.forEach(t=>{let b=document.createElement('button');b.dataset.transition=t[0];b.textContent=t[0]+' '+t[3];b.onclick=()=>fire(t[0]);document.querySelector('#transitionButtons').append(b)});document.querySelectorAll('[data-tier]').forEach(b=>b.onclick=()=>{view.dataset.tier=b.dataset.tier;render()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});document.querySelector('#reduceBtn').onclick=()=>{reduce=!reduce;render()};document.querySelector('#cycleBtn').onclick=()=>{scene.insertAdjacentHTML('beforeend',el('c1-cycle-accent','✦ · ✧ · ✦','particles'))};document.querySelector('#inspectorBtn').onclick=()=>document.querySelector('#inspector').classList.toggle('hidden');let cs=document.querySelector('#componentSelect'),ss=document.querySelector('#componentState');Object.keys(componentStates).forEach(c=>cs.add(new Option(c,c)));function fill(){ss.innerHTML='';[...variants[cs.value],...componentStates[cs.value],'stacking'].forEach(s=>ss.add(new Option(s,s)))}cs.onchange=fill;fill();document.querySelector('#applyComponent').onclick=()=>{componentDemo={c:cs.value,s:ss.value};if(cs.value==='C7')current='S10';if(cs.value==='C6')current='S8';if(cs.value==='C4'&&!['S3','S4','S5'].includes(current))current='S3';if(cs.value==='C5'&&!['S6','S7'].includes(current))current='S6';if(cs.value==='C2'||cs.value==='C3')current='S2';render()};render();
</script></body></html>
